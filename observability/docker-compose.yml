# docker-compose.yml
version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - observability

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'        # Allows hot-reload via POST /-/reload
    networks:
      - observability
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux compatibility

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin    # Default login: admin / admin
    volumes:
      - grafana-storage:/var/lib/grafana    # Persists dashboards across restarts
      - ./grafana/provisioning:/etc/grafana/provisioning 
    depends_on:
      - prometheus
    networks:
      - observability

networks:
  observability:
    driver: bridge

volumes:
  grafana-storage: